name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push auf denselben Branch bricht den noch laufenden Durchgang ab.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Die CUDA-Pakete (nvidia-cublas/-cudnn, zusammen über 1 GB) braucht nur die
      # Spracherkennung auf der Grafikkarte. Die Tests ersetzen Whisper durch
      # Attrappen; der echte Lauf ist Opt-in (FLEECH_STT_TEST=1).
      - name: Install dependencies (without the CUDA packages)
        run: |
          $req = Join-Path $env:RUNNER_TEMP "requirements-ci.txt"
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^\s*nvidia-' } | Set-Content $req
          python -m pip install -r $req "pytest>=8.0"

      # Vorerst ohne die zwei Autostart-Tests: Sie schreiben in den echten Run-Schlüssel
      # der Registry, den es auf dem Runner nicht gibt (FileNotFoundError). Sobald sie
      # einen eigenen Test-Eintrag nutzen, fallen die zwei --deselect wieder weg.
      # Beenden per TerminateProcess: Auf dem Runner stürzt der Prozess NACH dem
      # Testlauf beim Entladen nativer Bibliotheken ab (0xC0000005, lokal nicht).
      # Maßgeblich ist das Ergebnis von pytest; TerminateProcess überspringt das Entladen.
      - name: Run tests
        shell: python
        run: |
          import ctypes, sys
          import pytest
          code = int(pytest.main([
              "-q",
              "--deselect", "tests/test_autostart.py::test_enable_disable_roundtrip",
              "--deselect", "tests/test_autostart.py::test_refresh_updates_stale_path",
          ]))
          print(f"pytest exit code: {code}", flush=True)
          sys.stderr.flush()
          k32 = ctypes.windll.kernel32
          k32.GetCurrentProcess.restype = ctypes.c_void_p
          k32.TerminateProcess.argtypes = [ctypes.c_void_p, ctypes.c_uint]
          k32.TerminateProcess(k32.GetCurrentProcess(), code)
